<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="140" viewBox="0 0 400 140" role="img" aria-labelledby="title"><title id="title">Library Service — library management system. Complete technology stack.</title><rect width="400" height="140" fill="#0d1117"/><path d="M 16 4 V 136" stroke="#80cfff" stroke-width="2"/><text x="28" y="17" fill="#80cfff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Library Service ↗</text><text x="28" y="34" fill="#a2adba" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">A library management system covering catalogs, user accounts,</text><text x="28" y="48" fill="#a2adba" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400">reservations, loans, returns, fines and notifications.</text><text x="28" y="63" fill="#a2adba" font-family="Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">Java 17 · Spring Boot · Spring Web MVC · Spring Data JPA /</text><text x="28" y="75" fill="#a2adba" font-family="Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">Hibernate · Spring Security / JWT</text><text x="28" y="87" fill="#a2adba" font-family="Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">PostgreSQL database · Kafka events · Redis caching · MinIO /</text><text x="28" y="99" fill="#a2adba" font-family="Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">S3 storage</text><text x="28" y="111" fill="#a2adba" font-family="Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">Docker Compose · Maven · Git · Swagger / OpenAPI · Postman</text><text x="28" y="123" fill="#a2adba" font-family="Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">JUnit 5 · Mockito · Micrometer · Prometheus · Grafana ·</text><text x="28" y="135" fill="#a2adba" font-family="Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400">JavaMail / SMTP</text></svg>
